[package]
name = "viet-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
autotests = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[test]]
name = "features"
path = "../tests/features.rs"

[[test]]
name = "parity"
path = "../tests/parity.rs"

[[test]]
name = "output_modes"
path = "../tests/output_modes.rs"

[[test]]
name = "ipc"
path = "../tests/ipc.rs"

[[test]]
name = "control"
path = "../tests/control.rs"
